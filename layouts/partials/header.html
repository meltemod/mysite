<nav>
  <a href="{{ "/" | relLangURL }}">Meltem Odabaş</a>
  <a href="{{ "/consulting/" | relLangURL }}">{{ i18n "nav_consulting" }}</a>
  <a href="{{ "/mentorship/" | relLangURL }}">{{ i18n "nav_mentorship" }}</a>
  <a href="{{ "/works/" | relLangURL }}">{{ i18n "nav_portfolio" }}</a>
  <a href="{{ "/about/" | relLangURL }}">{{ i18n "nav_about" }}</a>
  <span class="nav-spacer"></span>
  {{ range .Translations }}
    <a href="{{ .Permalink }}" class="lang-switch">{{ .Language.LanguageName }}</a>
  {{ end }}
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">☀︎</button>
</nav>
<script>
  (function() {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');
    if (root.getAttribute('data-theme') === 'dark') { btn.textContent = '☽'; }
    btn.addEventListener('click', function() {
      var isDark = root.getAttribute('data-theme') === 'dark';
      root.setAttribute('data-theme', isDark ? 'light' : 'dark');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      btn.textContent = isDark ? '☀︎' : '☽';
    });
  })();
</script>
