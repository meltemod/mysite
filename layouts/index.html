{{ define "main" }}
  {{ $admin := site.GetPage "authors/admin" }}

  {{ if $admin }}
    <section>
      <h1>{{ $admin.Title }}</h1>
      {{ with $admin.Content }}{{ . }}{{ end }}

      {{ with $admin.Resources.GetMatch "avatar*" }}
        <p><img src="{{ .RelPermalink }}" alt="{{ $admin.Title }}" style="max-width:220px;border-radius:999px;"></p>
      {{ end }}
    </section>
  {{ else }}
    <section>
      <h1>{{ site.Title }}</h1>
      <p>Add your homepage content.</p>
    </section>
  {{ end }}
{{ end }}
