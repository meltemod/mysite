{{ define "main" }}
  {{ $admin := site.GetPage "authors/admin" }}

  {{ if $admin }}
    <section class="home-hero">
      <div class="hero-grid">
        <div>
          <h1>{{ $admin.Title }}</h1>
          {{ with $admin.Params.role }}<p class="muted">{{ . }}</p>{{ end }}
          <div class="prose">{{ $admin.Content }}</div>

          <p class="hero-links">
            <a href="{{ "/research/" | relURL }}">Research</a>
            <a href="{{ "/works/" | relURL }}">Works</a>
            <a href="{{ "/coaching/" | relURL }}">Coaching</a>
          </p>
        </div>

        <div>
          {{ with $admin.Resources.GetMatch "avatar*" }}
            <img class="avatar" src="{{ .RelPermalink }}" alt="{{ $admin.Title }}">
          {{ end }}
        </div>
      </div>
    </section>
{{ end }}
